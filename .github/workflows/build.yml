name: build

# Phase 5 enables tag/push triggers after the local preflight is green.
# Until then the workflow is manual only:
#   gh workflow run build --repo HashtagViinz/SECMotionModel-GUI
on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64 (MinGW, static .exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build static .exe
        run: |
          mkdir -p dist
          docker build -f Dockerfile.windows --target export --output type=local,dest=dist .
          mv dist/secmotion-gui.exe dist/SECMotionModel-GUI-windows-x86_64.exe
          sha256sum dist/SECMotionModel-GUI-windows-x86_64.exe > dist/SHA256SUMS
          file dist/SECMotionModel-GUI-windows-x86_64.exe
          ls -lh dist

      # Wine 11 needs unconfined seccomp on the Docker 29 runner: the default
      # profile blocks a socket call and wineserver aborts with
      # "wine: socket : Function not implemented".
      - name: Wine smoke test (headless + windowed)
        run: |
          docker build -f Dockerfile.windows --target wine-env -t secgui-wine-env .
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD/dist/SECMotionModel-GUI-windows-x86_64.exe:/app/secmotion-gui.exe:ro" \
            -v "$PWD/examples:/app/examples:ro" \
            -v "$PWD/scripts/wine_smoke_test.sh:/usr/local/bin/wine_smoke_test.sh:ro" \
            secgui-wine-env bash /usr/local/bin/wine_smoke_test.sh /app/secmotion-gui.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secmotion-gui-windows-x86_64
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux x86_64 (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xorg-dev xvfb xauth libvulkan1 mesa-vulkan-drivers vulkan-tools file curl zsync
          python3 -m pip install --user cmake==3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure and build
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSECGUI_STATIC=ON \
            -DSECGUI_BUILD_TESTS=ON \
            -DWEBGPU_BACKEND=WGPU \
            -DWEBGPU_LINK_TYPE=STATIC \
            -DWEBGPU_BUILD_FROM_SOURCE=OFF \
            -DWGPU_VERSION=v24.0.3.1
          cmake --build build-linux -j "$(nproc)"
          ctest --test-dir build-linux --output-on-failure

      - name: Headless smoke test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          ./build-linux/secmotion-gui --headless --backend vulkan --strict \
            --scene examples/minimal/scene.json \
            --script examples/minimal/demo.jsonl \
            --output-dir out/linux
          test -s out/linux/minimal_frame2.png

      - name: Windowed smoke test (Xvfb)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build-linux/secmotion-gui --backend vulkan --strict \
              --scene examples/minimal/scene.json \
              --tasks examples/minimal/tasks.jsonl \
              --window-frames 60

      - name: Package and test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          bash scripts/package_appimage.sh build-linux/secmotion-gui dist
          ./dist/SECMotionModel-GUI-0.1.1-x86_64.AppImage --headless --backend vulkan --strict \
            --scene examples/minimal/scene.json \
            --script examples/minimal/demo.jsonl \
            --output-dir out/appimage
          test -s out/appimage/minimal_frame2.png
          sha256sum dist/*.AppImage > dist/SHA256SUMS
          ls -lh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secmotion-gui-linux-x86_64
          path: dist/
          if-no-files-found: error
